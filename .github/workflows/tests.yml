name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tmux build-essential
      - run: python -m unittest discover -s tests -v
        env:
          CC_WEB_TMUX_TESTS: "1"
      - run: python scripts/check_release.py
      - run: bash -n run.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: |
          for file in frontend/*.js backend/*.mjs; do
            node --check "$file"
          done

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
